  <style>
    /* Milon Tower — all page-specific refinements stay in this file. */
    body[data-page="project"][data-project="tower"] .tower-neighborhood {
      padding: 0;
    }

    body[data-page="project"][data-project="tower"] .tower-map-layout {
      display: grid;
      width: min(1740px, calc(100vw - 48px));
      grid-template-columns: minmax(250px, 0.46fr) minmax(0, 1.54fr);
      align-items: center;
      gap: clamp(28px, 3.5vw, 68px);
      margin-inline: auto;
      padding-block: 0;
    }

    body[data-page="project"][data-project="tower"] .tower-neighborhood__heading {
      width: auto;
      padding: 8px 0;
    }

    body[data-page="project"][data-project="tower"] .tower-nearby-copy h2 {
      max-width: 360px;
      font-family: var(--display);
      font-size: clamp(34px, 3.2vw, 54px);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.04;
    }

    body[data-page="project"][data-project="tower"] .tower-nearby-list {
      display: grid;
      gap: 0;
      margin-top: clamp(28px, 3vw, 42px);
      padding: 0;
      list-style: none;
    }

    body[data-page="project"][data-project="tower"] .tower-nearby-list li {
      position: relative;
      padding: 13px 0 13px 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      line-height: 1.48;
    }

    body[data-page="project"][data-project="tower"] .tower-nearby-list li:last-child {
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    body[data-page="project"][data-project="tower"] .tower-nearby-list li::before {
      position: absolute;
      top: 21px;
      left: 1px;
      width: 7px;
      height: 7px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      content: "";
    }

    body[data-page="project"][data-project="tower"] .tower-nearby-list strong {
      color: var(--white);
      font-weight: 600;
    }

    body[data-page="project"][data-project="tower"] .tower-map-layout .tower-interactive-map {
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
    }

    body[data-page="project"][data-project="tower"] .tower-map-layout .milon-map-root {
      height: auto;
      min-height: 0;
    }

    body[data-page="project"][data-project="tower"] .tower-map-layout .milon-map-stage {
      height: auto;
    }

    body[data-page="project"][data-project="tower"] .tower-map-layout .milon-map-canvas {
      width: 100%;
      max-height: none;
    }

    body[data-page="project"][data-project="tower"] .tower-apartment-choice__head {
      align-items: center;
      gap: 28px;
    }

    body[data-page="project"][data-project="tower"] .tower-apartment-choice__head .section-heading {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    body[data-page="project"][data-project="tower"] .tower-apartment-choice__head .section-heading p {
      align-self: start;
      max-width: 640px;
      margin: 0;
      font-size: 16px;
      line-height: 1.55;
    }

    body[data-page="project"][data-project="tower"] .tower-apartment-choice .floor-rail {
      max-height: none;
      overflow: visible;
    }

    body[data-page="project"][data-project="tower"] .tower-apartment-choice .floor-rail button {
      position: relative;
    }

    body[data-page="project"][data-project="tower"] .tower-apartment-choice .floor-rail button::after {
      position: absolute;
      top: 50%;
      left: 100%;
      width: 22px;
      height: 1px;
      background: rgba(0, 163, 135, 0.72);
      content: "";
    }

    body[data-page="project"][data-project="tower"] .finishing-intro .section-heading {
      max-width: 760px;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 10px;
      margin-bottom: 32px;
    }

    body[data-page="project"][data-project="tower"] .finishing-intro .eyebrow {
      display: none;
    }

    body[data-page="project"][data-project="tower"] .finishing-intro h2 {
      font-size: clamp(40px, 4.8vw, 72px);
    }

    body[data-page="project"][data-project="tower"] .finishing-intro .section-heading p {
      margin: 0;
    }

    body[data-page="project"][data-project="tower"] .finishing-grid {
      width: 100%;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 28px;
    }

    body[data-page="project"][data-project="tower"] .finishing-grid figure {
      display: block;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      border-radius: 5px;
      background: transparent;
    }

    body[data-page="project"][data-project="tower"] .finishing-grid figure img {
      width: 100%;
      height: auto;
      aspect-ratio: 2.1 / 1;
      object-fit: cover;
      object-position: center 60%;
    }

    body[data-page="project"][data-project="tower"] .tower-finish-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      width: calc(100% - 64px);
      margin-inline: auto;
    }

    body[data-page="project"][data-project="tower"] .tower-finish-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 36px;
      min-height: 230px;
      padding: 24px;
      border-radius: 5px;
      color: var(--ink);
      background: var(--white);
    }

    body[data-page="project"][data-project="tower"] .tower-finish-card header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
    }

    body[data-page="project"][data-project="tower"] .tower-finish-card h3 {
      margin: 0;
      font-family: var(--sans);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.3;
    }

    body[data-page="project"][data-project="tower"] .tower-finish-card header span {
      color: var(--jade-dark);
      font-size: 13px;
      white-space: nowrap;
    }

    body[data-page="project"][data-project="tower"] .tower-finish-card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.55;
    }

    @media (max-width: 1140px) {
      body[data-page="project"][data-project="tower"] .tower-map-layout {
        width: min(100% - 48px, 900px);
        grid-template-columns: 1fr;
        align-items: start;
      }

      body[data-page="project"][data-project="tower"] .tower-nearby-copy h2 {
        max-width: none;
      }

      body[data-page="project"][data-project="tower"] .tower-nearby-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 24px;
      }

      body[data-page="project"][data-project="tower"] .tower-map-layout .milon-map-root {
        min-height: 0;
      }

      body[data-page="project"][data-project="tower"] .tower-finish-cards {
        width: 100%;
        gap: 14px;
      }

      body[data-page="project"][data-project="tower"] .tower-finish-card {
        padding: 20px;
      }
    }

    @media (max-width: 760px) {
      body[data-page="project"][data-project="tower"] .tower-map-layout {
        width: calc(100vw - 32px);
        gap: 28px;
        padding-block: 0;
      }

      body[data-page="project"][data-project="tower"] .tower-nearby-copy h2 {
        font-size: 34px;
      }

      body[data-page="project"][data-project="tower"] .tower-nearby-list {
        grid-template-columns: 1fr;
        margin-top: 24px;
      }

      body[data-page="project"][data-project="tower"] .tower-nearby-list li {
        padding-block: 11px;
        font-size: 14px;
      }

      body[data-page="project"][data-project="tower"] .tower-nearby-list li::before {
        top: 19px;
      }

      body[data-page="project"][data-project="tower"] .tower-map-layout .milon-map-root {
        min-height: 0;
      }

      body[data-page="project"][data-project="tower"] .tower-map-layout .milon-map-panel,
      body[data-page="project"][data-project="tower"] .tower-map-layout .milon-map-root[data-panel-mode="preview"] .milon-map-panel {
        display: none;
        position: relative;
        inset: auto;
        width: 100%;
        height: 340px;
        max-height: none;
        margin: 0;
        border-radius: 0;
        transform: none;
      }

      body[data-page="project"][data-project="tower"] .tower-map-layout .milon-map-root[data-panel-open="true"] .milon-map-panel {
        display: flex;
      }

      body[data-page="project"][data-project="tower"] .tower-apartment-choice__head .section-heading h2 {
        margin-top: 0;
      }

      body[data-page="project"][data-project="tower"] .finishing-intro .section-heading {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      body[data-page="project"][data-project="tower"] .finishing-intro .section-heading p {
        margin-top: 0;
      }

      body[data-page="project"][data-project="tower"] .finishing-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      body[data-page="project"][data-project="tower"] .finishing-grid figure img {
        aspect-ratio: 4 / 3;
      }

      body[data-page="project"][data-project="tower"] .tower-finish-cards {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      body[data-page="project"][data-project="tower"] .tower-finish-card {
        min-height: 0;
        gap: 24px;
      }
    }
  </style>

<body data-page="project" data-project="tower">
  <div id="app"></div>
  <script>
    (() => {
      const copy = {
        hy: {
          title: "Milon Tower-ի հարևանությամբ",
          items: [
            "<strong>Այգիներ</strong>՝ զբոսանքի և հանգստի համար",
            "<strong>Սուրբ Հովհաննես Մկրտիչ եկեղեցի</strong>",
            "<strong>Մարզադպրոց և ֆիթնես կենտրոն</strong>",
            "<strong>Կարուսելներ</strong>՝ ընտանեկան ժամանցի համար",
            "<strong>Թենիսի կորտ</strong>",
            "<strong>Աբովյանի քաղաքապետարան</strong>",
            "<strong>Ուղիղ մուտք Երևանի կողմից</strong>՝ առանց ամբողջ քաղաքը հատելու"
          ]
        },
        ru: {
          title: "Рядом с Milon Tower",
          items: [
            "<strong>Парки</strong> — для прогулок и отдыха",
            "<strong>Церковь Святого Иоанна Крестителя</strong>",
            "<strong>Спортивная школа и фитнес-центр</strong>",
            "<strong>Карусели</strong> — для семейного отдыха",
            "<strong>Теннисный корт</strong>",
            "<strong>Мэрия Абовяна</strong>",
            "<strong>Прямой въезд со стороны Еревана</strong> — без необходимости пересекать весь город"
          ]
        }
      };

      const finishCards = {
        hy: [
          ["Մակերեսներ", "Նախնական հարդարումը ներառում է հարթեցված մակերեսներ։"],
          ["Ինժեներական մուտքեր", "Բնակարանները փոխանցվում են հիմնական ինժեներական մուտքերով։"],
          ["Կոմպլեկտացիա", "Վերջնական կոմպլեկտացիան հաստատվում է ընտրված բնակարանի պայմանագրում։"]
        ],
        ru: [
          ["Поверхности", "Предчистовая отделка включает выровненные поверхности."],
          ["Инженерные вводы", "Квартиры передаются с основными инженерными вводами."],
          ["Комплектация", "Окончательная комплектация закрепляется в договоре выбранной квартиры."]
        ]
      };

      const currentLanguage = () => document.documentElement.lang === "ru" ? "ru" : "hy";

      function enhanceTowerPage() {
        const section = document.querySelector("#tower-neighborhood");
        const heading = section?.querySelector(".tower-neighborhood__heading");
        const map = section?.querySelector(".tower-interactive-map");

        if (section && heading && map && !heading.dataset.towerNearbyEnhanced) {
          const language = currentLanguage();
          const content = copy[language];
          heading.dataset.towerNearbyEnhanced = "true";
          heading.classList.remove("page-shell");
          heading.innerHTML = `<div class="tower-nearby-copy"><h2>${content.title}</h2><ul class="tower-nearby-list">${content.items.map(item => `<li>${item}</li>`).join("")}</ul></div>`;

          const layout = document.createElement("div");
          layout.className = "tower-map-layout";
          section.insertBefore(layout, heading);
          layout.append(heading, map);
        }

        const finishing = document.querySelector(".finishing-grid");
        if (finishing && !finishing.dataset.towerFinishEnhanced) {
          const photo = finishing.querySelector("figure");
          if (photo) {
            finishing.dataset.towerFinishEnhanced = "true";
            photo.querySelector("figcaption")?.remove();
            const cards = document.createElement("div");
            cards.className = "tower-finish-cards";
            cards.innerHTML = finishCards[currentLanguage()].map(([title, description], index) =>
              `<article class="tower-finish-card"><header><h3>${title}</h3><span>[0${index + 1}]</span></header><p>${description}</p></article>`
            ).join("");
            finishing.replaceChildren(photo, cards);
          }
        }

        document.querySelectorAll(".tower-apartment-choice [data-floor]").forEach(button => {
          if (Number(button.dataset.floor) > 16) button.remove();
        });

        document.querySelectorAll(".fact-grid > div").forEach(card => {
          const label = card.querySelector("span")?.textContent.trim().toLowerCase();
          if (label === "этажей" || label === "հարկ") {
            const value = card.querySelector("strong");
            if (value && value.textContent !== "16") value.textContent = "16";
          }
        });

        document.querySelectorAll(".floor-unit-list .unit-row").forEach(row => {
          row.querySelectorAll(":scope > div").forEach(cell => {
            const label = cell.querySelector("small")?.textContent.trim().toLowerCase();
            const value = cell.querySelector("strong");
            if ((label === "этаж" || label === "հարկ") && value) {
              const updated = value.textContent.replace(/\/\s*25\s*$/, "/ 16");
              if (value.textContent !== updated) value.textContent = updated;
            }
          });
        });
      }

      let scheduled = false;
      const scheduleEnhancement = () => {
        if (scheduled) return;
        scheduled = true;
        queueMicrotask(() => {
          scheduled = false;
          enhanceTowerPage();
        });
      };

      const start = () => {
        const app = document.querySelector("#app");
        if (!app) return;
        new MutationObserver(scheduleEnhancement).observe(app, { childList: true, subtree: true });
        scheduleEnhancement();
      };

      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once: true });
      else start();
    })();
  </script>
</body>
</html>
